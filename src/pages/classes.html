<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classes – ZenCore Pilates</title>
  <link rel="stylesheet" href="../styles/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <nav class="navbar">
    <a href="../../index.html" class="nav-brand">ZenCore <span>Pilates</span></a>
    <ul class="nav-links">
      <li><a href="classes.html">Classes</a></li>
      <li><a href="schedule.html">Schedule</a></li>
      <li id="nav-auth"></li>
    </ul>
  </nav>

  <div class="page-header">
    <p class="section-tag">✦ What We Offer</p>
    <h1>Our Classes</h1>
    <p>Find the perfect class for your level and goals.</p>
  </div>

  <div class="classes-grid" id="classes-grid">
    <p class="empty-msg">Loading classes...</p>
  </div>

  <script type="module">
    import { supabase } from '../lib/supabase.js'

    // Cek auth untuk navbar
    const { data: { user } } = await supabase.auth.getUser()
    const navAuth = document.getElementById('nav-auth')
    if (user) {
      navAuth.innerHTML = `<a href="dashboard.html" class="btn-register">Dashboard</a>`
    } else {
      navAuth.innerHTML = `<a href="login.html" class="btn-login">Sign In</a>`
    }

    // Load classes
    const { data: classes } = await supabase
      .from('class_types')
      .select('*')
      .order('name')

    const grid = document.getElementById('classes-grid')

    if (!classes || classes.length === 0) {
      grid.innerHTML = '<p class="empty-msg">No classes available yet.</p>'
    } else {
      grid.innerHTML = classes.map(c => `
        <div class="class-card">
          <div class="class-level level-${c.level}">${c.level || 'all levels'}</div>
          <h3>${c.name}</h3>
          <p>${c.description || 'A wonderful pilates class for body and mind.'}</p>
          <div class="class-meta">
            <span>⏱ ${c.duration_minutes || 60} min</span>
            <span>👥 Max ${c.max_participants || 10}</span>
          </div>
          <a href="schedule.html" class="btn-primary">Book Now</a>
        </div>
      `).join('')
    }
  </script>
</body>
</html>
