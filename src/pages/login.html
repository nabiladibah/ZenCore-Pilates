<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In – ZenCore Pilates</title>
  <link rel="stylesheet" href="../styles/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <nav class="navbar">
    <a href="../../index.html" class="nav-brand">ZenCore <span>Pilates</span></a>
    <ul class="nav-links">
      <li><a href="../../index.html">Home</a></li>
      <li><a href="register.html" class="btn-register">Join Us</a></li>
    </ul>
  </nav>

  <section class="auth-page">
    <div class="auth-left">
      <p class="hero-tag">✦ Welcome Back</p>
      <h1>Good to see<br/>you again.</h1>
      <p>Your mat is waiting. Sign in to view your schedule and book your next class.</p>
    </div>

    <div class="auth-card">
      <h2>Sign In</h2>
      <p class="auth-sub">New here? <a href="register.html">Create an account</a></p>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@email.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Your password" />
      </div>

      <button class="btn-primary btn-full" id="btn-login">Sign In</button>
      <p class="auth-msg" id="auth-msg"></p>
    </div>
  </section>

  <script type="module">
    import { supabase } from '../lib/supabase.js'

    document.getElementById('btn-login').addEventListener('click', async () => {
      const email = document.getElementById('email').value
      const password = document.getElementById('password').value
      const msg = document.getElementById('auth-msg')

      const { error } = await supabase.auth.signInWithPassword({ email, password })

      if (error) {
        msg.style.color = '#c47b7b'
        msg.textContent = error.message
      } else {
        window.location.href = 'dashboard.html'
      }
    })
  </script>
</body>
</html>
