<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join Us – ZenCore Pilates</title>
  <link rel="stylesheet" href="../styles/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <nav class="navbar">
    <a href="../../index.html" class="nav-brand">ZenCore <span>Pilates</span></a>
    <ul class="nav-links">
      <li><a href="../../index.html">Home</a></li>
      <li><a href="login.html" class="btn-login">Sign In</a></li>
    </ul>
  </nav>

  <section class="auth-page">
    <div class="auth-left">
      <p class="hero-tag">✦ Welcome to ZenCore</p>
      <h1>Begin your<br/>wellness journey.</h1>
      <p>Join hundreds of women who found their strength, balance, and peace — one class at a time.</p>
    </div>

    <div class="auth-card">
      <h2>Create Account</h2>
      <p class="auth-sub">Already have an account? <a href="login.html">Sign in</a></p>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="fullname" placeholder="Your full name" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@email.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Min. 6 characters" />
      </div>

      <button class="btn-primary btn-full" id="btn-register">Join ZenCore</button>
      <p class="auth-msg" id="auth-msg"></p>
    </div>
  </section>

  <script type="module">
    import { supabase } from '../lib/supabase.js'

    document.getElementById('btn-register').addEventListener('click', async () => {
      const fullname = document.getElementById('fullname').value
      const email = document.getElementById('email').value
      const password = document.getElementById('password').value
      const msg = document.getElementById('auth-msg')

      const { error } = await supabase.auth.signUp({
        email,
        password,
        options: { data: { full_name: fullname } }
      })

      if (error) {
        msg.style.color = '#c47b7b'
        msg.textContent = error.message
      } else {
        msg.style.color = '#7b9c7b'
        msg.textContent = '✓ Account created! Please check your email to confirm.'
      }
    })
  </script>
</body>
</html>
